<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>READINGLAND - Article Library</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #FFF5F5 0%, #EBF8FF 50%, #F0FFF4 100%);
    }
    .font-bubble { font-family: 'Fredoka', cursive; }

    /* Pill Filter Styles */
    .filter-pill {
      transition: all 0.2s ease;
    }
    .filter-pill.active {
      background-color: #FF7B9C;
      color: white;
      box-shadow: 0px 4px 0px #E05275;
    }

    /* Video-like Card Animation */
    .article-card {
      transition: all 0.2s ease;
    }
    .article-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px -10px rgba(0,0,0,0.1);
    }
  </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-between p-4 sm:p-8 text-gray-700">

  <!-- Header / Navbar -->
  <header class="w-full max-w-7xl flex items-center justify-between py-4 border-b-2 border-pink-100 mb-6">
    <a href="dashboard.html" class="flex items-center gap-2 no-underline">
      <span class="text-3xl">📚</span>
      <h1 class="font-bubble text-3xl font-black text-pink-400 tracking-wide">READINGLAND</h1>
    </a>
    
    <div id="userHeaderArea" class="flex items-center gap-3">
      <span class="text-xs font-bold text-gray-400">Loading profile...</span>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="w-full max-w-7xl my-auto space-y-6">
    
    <!-- Top Bar: Navigation Tabs & Search Bar -->
    <div class="flex flex-col md:flex-row items-center justify-between gap-4 bg-white/80 p-4 rounded-3xl border-2 border-pink-100 shadow-sm">
      
      <!-- Library Switcher Tabs (Public vs My Articles) -->
      <div class="flex gap-2 w-full md:w-auto">
        <button id="tabPublic" onclick="switchLibraryTab('public')" class="flex-1 md:flex-none px-5 py-2.5 rounded-2xl font-black text-xs transition-all bg-pink-500 text-white shadow-md">
          🌐 Community Library
        </button>
        <button id="tabMyArticles" onclick="switchLibraryTab('mine')" class="flex-1 md:flex-none px-5 py-2.5 rounded-2xl font-black text-xs transition-all bg-gray-100 text-gray-600 hover:bg-gray-200">
          🔒 My Articles
        </button>
      </div>

      <!-- Search Input -->
      <div class="w-full md:w-96 relative">
        <input type="text" id="searchInput" oninput="applyFilters()" placeholder="Search by title, topic, or source..." class="w-full pl-10 pr-4 py-2.5 rounded-2xl border-2 border-pink-100 focus:border-pink-400 focus:outline-none font-bold text-xs bg-pink-50/30">
        <span class="absolute left-3.5 top-3 text-sm text-pink-300">🔍</span>
      </div>
    </div>

    <!-- Filters Bar (Pill buttons) -->
    <div class="space-y-3 bg-white/60 p-4 rounded-3xl border border-pink-50">
      
      <!-- Topic Filter -->
      <div class="flex items-center gap-2 overflow-x-auto pb-1 text-xs">
        <span class="font-black text-gray-400 min-w-max uppercase tracking-wider text-[10px]">Topic:</span>
        <button onclick="setFilter('topic', 'all')" class="filter-pill topic-pill active px-3.5 py-1.5 rounded-full font-bold bg-white text-gray-600 border border-gray-200 border-none cursor-pointer">All</button>
        <button onclick="setFilter('topic', 'Technology')" class="filter-pill topic-pill px-3.5 py-1.5 rounded-full font-bold bg-white text-gray-600 border border-gray-200 border-none cursor-pointer">Technology</button>
        <button onclick="setFilter('topic', 'Science')" class="filter-pill topic-pill px-3.5 py-1.5 rounded-full font-bold bg-white text-gray-600 border border-gray-200 border-none cursor-pointer">Science</button>
        <button onclick="setFilter('topic', 'Culture')" class="filter-pill topic-pill px-3.5 py-1.5 rounded-full font-bold bg-white text-gray-600 border border-gray-200 border-none cursor-pointer">Culture</button>
        <button onclick="setFilter('topic', 'Story')" class="filter-pill topic-pill px-3.5 py-1.5 rounded-full font-bold bg-white text-gray-600 border border-gray-200 border-none cursor-pointer">Stories</button>
      </div>

      <!-- CEFR Level Filter -->
      <div class="flex items-center gap-2 overflow-x-auto pb-1 text-xs">
        <span class="font-black text-gray-400 min-w-max uppercase tracking-wider text-[10px]">CEFR Level:</span>
        <button onclick="setFilter('level', 'all')" class="filter-pill level-pill active px-3.5 py-1.5 rounded-full font-bold bg-white text-gray-600 border border-gray-200 border-none cursor-pointer">All Levels</button>
        <button onclick="setFilter('level', 'A1-A2')" class="filter-pill level-pill px-3.5 py-1.5 rounded-full font-bold bg-white text-emerald-600 border border-emerald-200 border-none cursor-pointer">A1 - A2 (Beginner)</button>
        <button onclick="setFilter('level', 'B1-B2')" class="filter-pill level-pill px-3.5 py-1.5 rounded-full font-bold bg-white text-amber-600 border border-amber-200 border-none cursor-pointer">B1 - B2 (Intermediate)</button>
        <button onclick="setFilter('level', 'C1-C2')" class="filter-pill level-pill px-3.5 py-1.5 rounded-full font-bold bg-white text-rose-600 border border-rose-200 border-none cursor-pointer">C1 - C2 (Advanced)</button>
      </div>

    </div>

    <!-- YouTube-Style Grid Section -->
    <div id="articlesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 pt-2">
      <!-- Article Cards will be dynamically injected here -->
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-16 space-y-3">
      <div class="text-6xl">📭</div>
      <h3 class="font-bubble text-2xl font-bold text-gray-500">No Articles Found</h3>
      <p class="text-xs text-gray-400 font-semibold">Try adjusting your filters or create a new reading article!</p>
    </div>

  </main>

  <!-- Footer -->
  <footer class="w-full max-w-7xl text-center py-4 border-t-2 border-pink-100 mt-8 text-xs text-gray-400 font-bold">
    READINGLAND © 2026 - Designed for English Learners Worldwide 🌍
  </footer>

  <!-- SCRIPT FIREBASE & LOGIC -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyALqBf4DWC0NLXgxvGVWq8_qgr8SWWS7pY",
      authDomain: "readingland-bccc1.firebaseapp.com",
      projectId: "readingland-bccc1",
      storageBucket: "readingland-bccc1.firebasestorage.app",
      messagingSenderId: "941153833738",
      appId: "1:941153833738:web:0628eb2998541913ae20f3",
      measurementId: "G-DZZGN7R0PR"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let currentTab = 'public'; // 'public' or 'mine'
    let selectedTopic = 'all';
    let selectedLevel = 'all';
    let allArticles = [];

    // Array of abstract gradient backgrounds for placeholder thumbnails
    const gradients = [
      'linear-gradient(135deg, #FF9A9E 0%, #FECFEF 100%)',
      'linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%)',
      'linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%)',
      'linear-gradient(135deg, #fabc3c 0%, #F7C59F 100%)',
      'linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%)',
      'linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%)'
    ];

    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUser = user;
        let displayName = user.displayName || user.email?.split('@')[0] || "Learner";
        document.getElementById('userHeaderArea').innerHTML = `
          <a href="profile.html" class="flex items-center gap-1.5 text-xs font-black text-pink-600 bg-pink-100 px-3.5 py-1.5 rounded-full hover:bg-pink-200 transition-all no-underline border border-pink-200">
            <span>👤</span>
            <span>${displayName}</span>
          </a>
          <button onclick="handleLogout()" class="text-xs font-bold text-gray-400 hover:text-pink-500 underline border-none bg-transparent cursor-pointer">Logout</button>
        `;
        fetchArticles();
      } else {
        window.location.replace("index.html");
      }
    });

    async function fetchArticles() {
      try {
        let query;
        if (currentTab === 'public') {
          query = db.collection('articles').where('isPublic', '==', true);
        } else {
          query = db.collection('articles').where('authorId', '==', currentUser.uid);
        }

        const snapshot = await query.get();
        allArticles = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        applyFilters();
      } catch (err) {
        console.error("Error loading articles:", err);
      }
    }

    function switchLibraryTab(tab) {
      currentTab = tab;
      const tabPublic = document.getElementById('tabPublic');
      const tabMyArticles = document.getElementById('tabMyArticles');

      if (tab === 'public') {
        tabPublic.className = "flex-1 md:flex-none px-5 py-2.5 rounded-2xl font-black text-xs transition-all bg-pink-500 text-white shadow-md cursor-pointer";
        tabMyArticles.className = "flex-1 md:flex-none px-5 py-2.5 rounded-2xl font-black text-xs transition-all bg-gray-100 text-gray-600 hover:bg-gray-200 cursor-pointer";
      } else {
        tabMyArticles.className = "flex-1 md:flex-none px-5 py-2.5 rounded-2xl font-black text-xs transition-all bg-pink-500 text-white shadow-md cursor-pointer";
        tabPublic.className = "flex-1 md:flex-none px-5 py-2.5 rounded-2xl font-black text-xs transition-all bg-gray-100 text-gray-600 hover:bg-gray-200 cursor-pointer";
      }
      fetchArticles();
    }

    function setFilter(type, value) {
      if (type === 'topic') {
        selectedTopic = value;
        document.querySelectorAll('.topic-pill').forEach(btn => btn.classList.remove('active'));
      } else if (type === 'level') {
        selectedLevel = value;
        document.querySelectorAll('.level-pill').forEach(btn => btn.classList.remove('active'));
      }
      event.target.classList.add('active');
      applyFilters();
    }

    function applyFilters() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();

      const filtered = allArticles.filter(item => {
        const matchesSearch = (item.title || '').toLowerCase().includes(searchTerm) ||
                              (item.topic || '').toLowerCase().includes(searchTerm) ||
                              (item.source || '').toLowerCase().includes(searchTerm);
        
        const matchesTopic = selectedTopic === 'all' || item.topic === selectedTopic;
        const matchesLevel = selectedLevel === 'all' || item.cefrLevel === selectedLevel;

        return matchesSearch && matchesTopic && matchesLevel;
      });

      renderArticles(filtered);
    }

    function renderArticles(list) {
      const grid = document.getElementById('articlesGrid');
      const emptyState = document.getElementById('emptyState');
      grid.innerHTML = '';

      if (list.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      list.forEach((art, idx) => {
        const gradientBg = gradients[idx % gradients.length];
        const card = document.createElement('div');
        card.className = "article-card bg-white rounded-3xl overflow-hidden border-2 border-pink-100/80 cursor-pointer flex flex-col justify-between";
        card.onclick = () => {
          window.location.href = `article-detail.html?id=${art.id}`;
        };

        card.innerHTML = `
          <div>
            <!-- Abstract Placeholder Thumbnail -->
            <div class="h-40 w-full p-4 flex flex-col justify-between relative overflow-hidden" style="background: ${gradientBg};">
              <div class="flex justify-between items-center relative z-10">
                <span class="px-2.5 py-1 bg-black/30 backdrop-blur-md text-white rounded-full text-[10px] font-black uppercase tracking-wider">
                  ${art.topic || 'General'}
                </span>
                <span class="px-2.5 py-1 bg-white/90 text-gray-800 rounded-full text-[10px] font-black uppercase tracking-wider shadow-sm">
                  CEFR ${art.cefrLevel || 'B1'}
                </span>
              </div>
              <div class="text-3xl opacity-30 absolute -right-2 -bottom-2 select-none">📖</div>
            </div>

            <!-- Content Area -->
            <div class="p-4 space-y-2">
              <h3 class="font-bubble text-lg font-black text-gray-800 line-clamp-2 leading-snug">
                ${art.title || 'Untitled Article'}
              </h3>
              
              <div class="flex items-center gap-2 text-xs font-extrabold text-gray-400 pt-1">
                <span>👤 ${art.authorName || 'Anonymous'}</span>
                <span>•</span>
                <span>📌 ${art.source || 'Original'}</span>
              </div>
            </div>
          </div>

          <!-- Bottom Action -->
          <div class="px-4 pb-4 pt-1 flex items-center justify-between text-xs font-black text-pink-500">
            <span>Read Article</span>
            <span>➔</span>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    function handleLogout() {
      auth.signOut().then(() => window.location.replace("index.html"));
    }
  </script>
</body>
</html>
