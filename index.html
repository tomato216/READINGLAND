<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>READINGLAND - Your Cozy Reading Corner</title>
  
  <!-- Google Fonts: Fredoka & Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #FFF5F5 0%, #EBF8FF 50%, #F0FFF4 100%);
    }
    
    .font-bubble {
      font-family: 'Fredoka', cursive;
    }

    /* Hiệu ứng Chữ Nổi 3D Pastel */
    .bubble-title {
      color: #FF7B9C;
      text-shadow: 
        3px 3px 0px #FFC2D1,
        6px 6px 0px #FFE5EC,
        8px 8px 12px rgba(255, 123, 156, 0.25);
      letter-spacing: 2px;
    }

    /* Hiệu ứng Nút Bấm 3D Nẩy */
    .btn-3d {
      transition: all 0.15s ease;
      box-shadow: 0px 6px 0px var(--shadow-color);
    }
    
    .btn-3d:hover {
      transform: translateY(-2px);
      box-shadow: 0px 8px 0px var(--shadow-color);
    }
    
    .btn-3d:active {
      transform: translateY(4px);
      box-shadow: 0px 2px 0px var(--shadow-color);
    }

    .btn-primary {
      background-color: #FF7B9C;
      color: #FFFFFF;
      --shadow-color: #E05275;
    }

    .btn-secondary-1 {
      background-color: #A8E6CF;
      color: #24523E;
      --shadow-color: #62B897;
    }

    .btn-secondary-2 {
      background-color: #FFD3B6;
      color: #5C3215;
      --shadow-color: #E8A174;
    }

    .btn-secondary-3 {
      background-color: #D4A5A5;
      color: #FFFFFF;
      --shadow-color: #A57373;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    
    .floating {
      animation: float 4s ease-in-out infinite;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4 relative overflow-x-hidden text-gray-700">

  <!-- Họa tiết mây trôi trang trí -->
  <div class="absolute top-6 left-8 text-4xl opacity-40 floating">☁️</div>
  <div class="absolute top-10 right-10 text-3xl opacity-40 floating" style="animation-delay: 1.5s;">✨</div>
  <div class="absolute bottom-8 left-10 text-3xl opacity-40 floating" style="animation-delay: 2s;">📖</div>
  <div class="absolute bottom-10 right-12 text-4xl opacity-40 floating" style="animation-delay: 0.8s;">☁️</div>

  <!-- Bố cục Trung tâm (Đã căn chỉnh thu gọn khoảng cách) -->
  <main class="max-w-2xl w-full text-center z-10 flex flex-col items-center my-auto py-4">
    
    <!-- Tag Welcome -->
    <span class="inline-block px-3 py-1 mb-2 text-xs font-extrabold text-pink-500 bg-pink-100/80 rounded-full tracking-wider uppercase shadow-sm">
      ✨ Welcome to ✨
    </span>

    <!-- Tiêu đề READINGLAND -->
    <h1 class="font-bubble text-5xl sm:text-6xl md:text-7xl font-black bubble-title mb-2 select-none">
      READINGLAND
    </h1>

    <!-- Dòng mô tả -->
    <p class="text-lg sm:text-xl font-bold text-gray-500 mb-6 tracking-wide">
      Your cozy reading corner 📖✨
    </p>

    <!-- Nút Bắt đầu chính -->
    <div class="w-full max-w-xs mb-6">
      <a href="addnewarticle.html" class="btn-3d btn-primary w-full py-3.5 px-6 rounded-2xl text-lg font-extrabold flex items-center justify-center gap-2 no-underline">
        <span class="text-xl">➕</span>
        <span>Add New Article</span>
      </a>
    </div>

    <!-- Các Nút Phụ Bên Dưới -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 w-full max-w-xl">
      
      <!-- Nút Thư viện -->
      <a href="mylibrary.html" class="btn-3d btn-secondary-1 py-2.5 px-3 rounded-xl font-extrabold text-sm sm:text-base flex items-center justify-center gap-1.5 no-underline">
        <span class="text-lg">📚</span>
        <span>My Library</span>
      </a>

      <!-- Nút Sổ từ vựng -->
      <a href="vocabularynotebook.html" class="btn-3d btn-secondary-2 py-2.5 px-3 rounded-xl font-extrabold text-sm sm:text-base flex items-center justify-center gap-1.5 no-underline">
        <span class="text-lg">📇</span>
        <span>Vocabulary Notebook</span>
      </a>

      <!-- Nút Tiến độ -->
      <a href="myprogress.html" class="btn-3d btn-secondary-3 py-2.5 px-3 rounded-xl font-extrabold text-sm sm:text-base flex items-center justify-center gap-1.5 no-underline">
        <span class="text-lg">📊</span>
        <span>My Progress</span>
      </a>

    </div>

  </main>

</body>
</html>
